# Fly.io — always-on Cambio server (in-memory game state, single instance).
# Deploy: fly auth login && fly launch --no-deploy  (first time)
#         fly deploy

app = 'cambio-card-game'
primary_region = 'iad'

[build]
  dockerfile = 'deploy/Dockerfile.server'

[env]
  CAMBIO_MODEL_PATH = '/app/models/cambio'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/games'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

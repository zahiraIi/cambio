services:
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    image: cambio-server:latest
    ports:
      - "8080:8080"
    environment:
      CAMBIO_MODEL_PATH: /app/models/cambio
    restart: unless-stopped

  trainer:
    profiles: ["train"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.ai
    image: cambio-ai:latest
    volumes:
      - ./models:/data/models
    command:
      - python
      - train.py
      - --episodes
      - "50000"
      - --self-play
      - --save-path
      - /data/models/cambio
      - --num-players
      - "4"

apiVersion: v1
kind: Service
metadata:
  name: cambio-server
  namespace: cambio
  labels:
    app: cambio
    component: server
spec:
  type: ClusterIP
  selector:
    app: cambio
    component: server
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: cambio-server-external
  namespace: cambio
  labels:
    app: cambio
    component: server
spec:
  type: LoadBalancer
  selector:
    app: cambio
    component: server
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
